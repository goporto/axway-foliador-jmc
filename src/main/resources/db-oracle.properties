###############################################################################
# CONFIGURACIÓN DE BASE DE DATOS DE DESARROLLO (POSTGRESQL)
###############################################################################

# Parámetros de Conexión JDBC (PostgreSQL Local / Docker)
db.url=jdbc:oracle:thin:@192.168.1.163:1521/FREEPDB1
db.user=OPE_FMT
db.password=OPE_FMT123

# Driver de la Base de Datos
db.driver=oracle.jdbc.OracleDriver

###############################################################################
# CONFIGURACIÓN DE POOL HIKARICP (OPTIMIZACIÓN Y CONCURRENCIA)
###############################################################################

# Tamaño Máximo del Pool de Conexiones
db.pool.maxSize=10

# Conexiones Mínimas Inactivas (Idle)
db.pool.minIdle=2

# Timeout de espera para obtener una conexión del pool (en milisegundos)
db.pool.connectionTimeout=10000

# Tiempo máximo que una conexión puede estar inactiva en el pool (en milisegundos)
db.pool.idleTimeout=30000

# Tiempo máximo de vida de una conexión en el pool (30 minutos)
db.pool.maxLifetime=1800000

# Query de Validación de Conexión
db.pool.validationQuery=SELECT 1